<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamSmart – Upload Video Stream</title>
  <link rel="icon" type="image/svg+xml" href="/streamsmart-icon.svg" />
  <style>
    :root {
      --primary: #7060B5;
      --primary-dark: #514398;
      --primary-subtle: #EDE4FF;
      --bg: #FDF7FF;
      --surface: #FFFFFF;
      --text: #1D182F;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --border-focus: #7060B5;
      --success: #16A34A;
      --success-bg: #F0FDF4;
      --error: #DC2626;
      --error-bg: #FEF2F2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .upload-container {
      width: 100%;
      max-width: 540px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--primary-subtle);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-control:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(112, 96, 181, 0.15);
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: #FAFAFD;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: var(--primary-subtle);
    }

    .dropzone-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-subtle);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .dropzone-text {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .dropzone-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .file-preview {
      display: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--success);
      margin-top: 8px;
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(112, 96, 181, 0.3);
      transition: background 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
    }

    .btn-submit:disabled {
      background: #D1D5DB;
      cursor: not-allowed;
      box-shadow: none;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid #FECACA;
      color: var(--error);
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid #BBF7D0;
      color: var(--success);
    }

    .progress-bar-wrap {
      display: none;
      margin-bottom: 18px;
    }

    .progress-bar {
      height: 6px;
      border-radius: 3px;
      background: #E5E7EB;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <div class="header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
          <path d="M12 12v9" />
          <path d="m16 16-4-4-4 4" />
        </svg>
      </div>
      <h1>Upload Video Stream</h1>
      <p>Automatic 6MB chunking & adaptive HLS (.m3u8) transcoding</p>
    </div>

    <div class="card">
      <div id="alertBox" class="alert"></div>

      <form id="uploadForm" action="/api/video/upload" method="POST" enctype="multipart/form-data">
        <!-- 1. Video Title -->
        <div class="form-group">
          <label class="form-label" for="titleInput">Video Title</label>
          <input
            id="titleInput"
            name="title"
            type="text"
            class="form-control"
            placeholder="e.g. 4K Nature Benchmark Stream"
            required
          />
        </div>

        <!-- 2. Video File Input -->
        <div class="form-group">
          <label class="form-label">Video File</label>
          <input
            id="fileInput"
            name="video"
            type="file"
            accept="video/*"
            style="display: none;"
            required
          />
          <div id="dropzone" class="dropzone">
            <div class="dropzone-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="18" x="3" y="3" rx="2"/>
                <path d="m9 8 6 4-6 4Z"/>
              </svg>
            </div>
            <div class="dropzone-text">Click to choose or drag & drop video</div>
            <div class="dropzone-sub">Supports MP4, MKV, MOV, WEBM</div>
            <div id="filePreview" class="file-preview"></div>
          </div>
        </div>

        <!-- Progress bar -->
        <div id="progressWrap" class="progress-bar-wrap">
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
            <span>Uploading to Cloudinary…</span>
            <span id="progressPct">0%</span>
          </div>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <!-- 3. Upload Video Submit Button -->
        <button id="submitBtn" type="submit" class="btn-submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
            <path d="M12 12v9" />
            <path d="m16 16-4-4-4 4" />
          </svg>
          <span>Upload Video</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const filePreview = document.getElementById('filePreview');
    const titleInput = document.getElementById('titleInput');
    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressPct = document.getElementById('progressPct');

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        fileInput.files = e.dataTransfer.files;
        handleSelectedFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files[0]) {
        handleSelectedFile(fileInput.files[0]);
      }
    });

    function handleSelectedFile(file) {
      filePreview.style.display = 'block';
      filePreview.textContent = 'Selected: ' + file.name + ' (' + (file.size / 1024 / 1024).toFixed(1) + ' MB)';
      if (!titleInput.value) {
        titleInput.value = file.name.replace(/\.[^/.]+$/, '');
      }
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      const title = titleInput.value.trim();

      if (!file) {
        showAlert('Please select a video file.', 'error');
        return;
      }
      if (!title) {
        showAlert('Please enter a video title.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Uploading…';
      progressWrap.style.display = 'block';
      alertBox.style.display = 'none';

      let simulatedProgress = 20;
      progressFill.style.width = simulatedProgress + '%';
      progressPct.textContent = simulatedProgress + '%';

      const interval = setInterval(() => {
        if (simulatedProgress < 85) {
          simulatedProgress += 10;
          progressFill.style.width = simulatedProgress + '%';
          progressPct.textContent = simulatedProgress + '%';
        }
      }, 500);

      const formData = new FormData();
      formData.append('video', file);
      formData.append('title', title);

      try {
        const response = await fetch('/api/video/upload', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        clearInterval(interval);
        progressFill.style.width = '100%';
        progressPct.textContent = '100%';

        if (!response.ok) {
          throw new Error(data.error || 'Upload failed');
        }

        showAlert('Video uploaded successfully! HLS Manifest: ' + (data.video?.hlsPlaylistUrl || 'ready'), 'success');
        submitBtn.innerHTML = 'Uploaded!';
      } catch (err) {
        clearInterval(interval);
        showAlert(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Upload Video';
      }
    });

    function showAlert(msg, type) {
      alertBox.className = 'alert alert-' + type;
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
